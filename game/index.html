<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Velvet Vault — a heist in three rooms</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03050c; }
  body { display: flex; align-items: center; justify-content: center; }
  /* The game paints at 1280 by 800 and is scaled to fit the window, never stretched. */
  #game { display: block; width: min(100vw, 160vh); height: min(100vh, 62.5vw); cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="The Velvet Vault: sneak a thief past guards and cameras, pick the lock on the loot and get back to the door"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
